<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteo de Piezas</title>
<style>
  :root{
    --bg:#0b1020;
    --card:#121a2e;
    --card2:#182238;
    --text:#f8fafc;
    --muted:#94a3b8;
    --line:rgba(255,255,255,.10);
    --accent:#38bdf8;
    --green:#22c55e;
    --yellow:#fbbf24;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 10%,rgba(56,189,248,.13),transparent 28%),
      radial-gradient(circle at 85% 0%,rgba(34,197,94,.09),transparent 25%),
      linear-gradient(155deg,#050816,#0b1020 55%,#111827);
  }
  .wrap{width:min(1120px,92vw);margin:auto;padding:44px 0 60px}
  header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}
  h1{font-size:clamp(38px,7vw,72px);line-height:.95;letter-spacing:-.055em;margin:0}
  .sub{color:var(--muted);margin-top:12px}
  .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#cbd5e1;border:1px solid var(--line);padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.035)}
  .panel{
    border:1px solid var(--line);
    border-radius:26px;
    overflow:hidden;
    background:rgba(11,16,32,.72);
    box-shadow:0 28px 80px rgba(0,0,0,.32);
    backdrop-filter:blur(14px);
  }
  .machine{
    min-height:285px;
    display:grid;
    place-items:center;
    position:relative;
    padding:40px 28px;
    border-bottom:1px solid var(--line);
  }
  .machine:after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at center,rgba(56,189,248,.08),transparent 55%);
    pointer-events:none
  }
  .label{position:absolute;top:20px;left:22px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
  #display{
    text-align:center;font-size:clamp(34px,7vw,78px);font-weight:900;
    letter-spacing:-.05em;z-index:1;min-height:1.25em;
  }
  #status{
    position:absolute;bottom:20px;color:var(--muted);font-size:14px;z-index:1
  }
  .bar{height:5px;background:#0f172a}
  #progress{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .35s ease}
  .controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:21px;border-bottom:1px solid var(--line)}
  button{border:0;border-radius:14px;padding:14px 22px;font-size:15px;font-weight:850;cursor:pointer;transition:.18s ease}
  button:hover{transform:translateY(-1px)}
  button:disabled{opacity:.4;cursor:default;transform:none}
  .primary{background:#f8fafc;color:#0f172a}
  .secondary{background:#172033;color:#e2e8f0;border:1px solid var(--line)}
  .results{padding:26px}
  .results h2{margin:0 0 18px;font-size:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}
  .room{
    border:1px solid var(--line);border-radius:18px;padding:18px;background:rgba(255,255,255,.035);
    opacity:0;transform:translateY(12px) scale(.985);
    transition:.45s cubic-bezier(.2,.8,.2,1)
  }
  .room.show{opacity:1;transform:none}
  .room.special{border-color:rgba(251,191,36,.48);background:rgba(251,191,36,.065)}
  .type{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin-bottom:8px}
  .names{font-size:21px;font-weight:850;line-height:1.25}
  .note{font-size:12px;color:#fcd34d;margin-top:10px;line-height:1.35}
  .done{
    display:none;margin-top:20px;padding:16px;border-radius:16px;
    background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);
    color:#bbf7d0;font-weight:750;text-align:center
  }
  .done.show{display:block}
  footer{color:#64748b;text-align:center;font-size:12px;margin-top:16px}
  @media(max-width:600px){header{align-items:start;flex-direction:column}.wrap{padding-top:28px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Sorteo de piezas</h1>
      <div class="sub">Asignación automática de habitaciones</div>
    </div>
    <div class="tag">Sorteo aleatorio</div>
  </header>

  <section class="panel">
    <div class="machine">
      <div class="label">Asignando ahora</div>
      <div id="display">Listos para sortear</div>
      <div id="status">Presiona “Iniciar sorteo”</div>
    </div>
    <div class="bar"><div id="progress"></div></div>

    <div class="controls">
      <button class="primary" id="start">Iniciar sorteo</button>
      <button class="secondary" id="reset">Reiniciar</button>
    </div>

    <div class="results">
      <h2>Distribución</h2>
      <div class="grid" id="grid"></div>
      <div class="done" id="done">✓ Sorteo finalizado. Distribución cerrada.</div>
    </div>
  </section>

  <footer>El orden de aparición se simula dinámicamente durante el sorteo.</footer>
</div>

<script>
const rooms = [
  {type:"Pieza · 3 cabros", names:"Guzmán · Bertrand · Juan"},
  {type:"Pieza · 2 cabros", names:"Diego · Cleme · Mery", special:true, note:"⚠ Mery quedó aleatoriamente asignado a esta pieza, por lo que finalmente van 3."},
  {type:"Pieza · 2 cabros", names:"Opazo · Lewin"},
  {type:"Pieza · 2 parejas", names:"Bru + Belén  /  Velasco + Maida"},
  {type:"Pieza · 1 pareja", names:"Tagle + Mery"},
  {type:"Pieza M · 1 pareja", names:"Erenchun + Tere"},
  {type:"Pieza · 1 pareja", names:"Cabezón + Paula"}
];

const spinnerNames = [
  "Guzmán","Bertrand","Juan","Diego","Cleme","Mery","Opazo","Lewin",
  "Bru","Belén","Velasco","Maida","Tagle","Erenchun","Tere","Cabezón","Paula"
];

const display = document.getElementById("display");
const status = document.getElementById("status");
const grid = document.getElementById("grid");
const progress = document.getElementById("progress");
const start = document.getElementById("start");
const reset = document.getElementById("reset");
const done = document.getElementById("done");

let running = false;

function renderEmpty(){
  grid.innerHTML = "";
  rooms.forEach((r,i)=>{
    const card=document.createElement("div");
    card.className="room"+(r.special?" special":"");
    card.id="room-"+i;
    card.innerHTML=`
      <div class="type">${r.type}</div>
      <div class="names">${r.names}</div>
      ${r.note?`<div class="note">${r.note}</div>`:""}
    `;
    grid.appendChild(card);
  });
}
renderEmpty();

function sleep(ms){ return new Promise(res=>setTimeout(res,ms)); }

async function fakeSpin(finalText, roomIndex){
  status.textContent = `Sorteando pieza ${roomIndex+1} de ${rooms.length}…`;
  const cycles = 16 + Math.floor(Math.random()*8);
  for(let i=0;i<cycles;i++){
    const shuffled=[...spinnerNames].sort(()=>Math.random()-.5);
    const take = roomIndex === 0 ? 3 : 2;
    display.textContent = shuffled.slice(0,take).join(" · ");
    await sleep(55 + Math.min(i*5,60));
  }
  display.textContent = finalText;
  const card=document.getElementById("room-"+roomIndex);
  card.classList.add("show");
  progress.style.width = `${((roomIndex+1)/rooms.length)*100}%`;
  await sleep(700);
}

async function run(){
  if(running) return;
  running=true;
  start.disabled=true;
  done.classList.remove("show");
  document.querySelectorAll(".room").forEach(c=>c.classList.remove("show"));
  progress.style.width="0%";
  display.textContent="Mezclando nombres…";
  status.textContent="Preparando sorteo…";
  await sleep(800);

  for(let i=0;i<rooms.length;i++){
    await fakeSpin(rooms[i].names, i);
  }

  display.textContent="Sorteo terminado";
  status.textContent="Todas las piezas fueron asignadas";
  done.classList.add("show");
  running=false;
  start.disabled=false;
}

function doReset(){
  if(running) return;
  document.querySelectorAll(".room").forEach(c=>c.classList.remove("show"));
  progress.style.width="0%";
  display.textContent="Listos para sortear";
  status.textContent="Presiona “Iniciar sorteo”";
  done.classList.remove("show");
}

start.addEventListener("click",run);
reset.addEventListener("click",doReset);
</script>
</body>
</html>
