<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteo de Piezas</title>
<style>
  :root{
    --bg:#0b1020;
    --card:#121a2e;
    --card2:#182238;
    --text:#f8fafc;
    --muted:#94a3b8;
    --line:rgba(255,255,255,.10);
    --accent:#38bdf8;
    --green:#22c55e;
    --yellow:#fbbf24;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 10%,rgba(56,189,248,.13),transparent 28%),
      radial-gradient(circle at 85% 0%,rgba(34,197,94,.09),transparent 25%),
      linear-gradient(155deg,#050816,#0b1020 55%,#111827);
  }
  .wrap{width:min(1120px,92vw);margin:auto;padding:44px 0 60px}
  header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}
  h1{font-size:clamp(38px,7vw,72px);line-height:.95;letter-spacing:-.055em;margin:0}
  .sub{color:var(--muted);margin-top:12px}
  .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#cbd5e1;border:1px solid var(--line);padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.035)}
  .panel{
    border:1px solid var(--line);
    border-radius:26px;
    overflow:hidden;
    background:rgba(11,16,32,.72);
    box-shadow:0 28px 80px rgba(0,0,0,.32);
    backdrop-filter:blur(14px);
  }
  .machine{
    min-height:285px;
    display:grid;
    place-items:center;
    position:relative;
    padding:40px 28px;
    border-bottom:1px solid var(--line);
  }
  .machine:after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at center,rgba(56,189,248,.08),transparent 55%);
    pointer-events:none
  }
  .label{position:absolute;top:20px;left:22px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
  #display{
    text-align:center;font-size:clamp(34px,7vw,78px);font-weight:900;
    letter-spacing:-.05em;z-index:1;min-height:1.25em;
  }
  #status{
    position:absolute;bottom:20px;color:var(--muted);font-size:14px;z-index:1
  }
  .bar{height:5px;background:#0f172a}
  #progress{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .35s ease}
  .controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:21px;border-bottom:1px solid var(--line)}
  button{border:0;border-radius:14px;padding:14px 22px;font-size:15px;font-weight:850;cursor:pointer;transition:.18s ease}
  button:hover{transform:translateY(-1px)}
  button:disabled{opacity:.4;cursor:default;transform:none}
  .primary{background:#f8fafc;color:#0f172a}
  .secondary{background:#172033;color:#e2e8f0;border:1px solid var(--line)}
  .results{padding:26px}
  .results h2{margin:0 0 18px;font-size:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}
  .room{
    border:1px solid var(--line);border-radius:18px;padding:18px;background:rgba(255,255,255,.035);
    opacity:0;transform:translateY(12px) scale(.985);
    transition:.45s cubic-bezier(.2,.8,.2,1)
  }
  .room.show{opacity:1;transform:none}
  .room.special{border-color:rgba(251,191,36,.48);background:rgba(251,191,36,.065)}
  .type{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin-bottom:8px}
  .names{font-size:21px;font-weight:850;line-height:1.25}
  .note{font-size:12px;color:#fcd34d;margin-top:10px;line-height:1.35}
  .done{
    display:none;margin-top:20px;padding:16px;border-radius:16px;
    background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);
    color:#bbf7d0;font-weight:750;text-align:center
  }
  .done.show{display:block}
  footer{color:#64748b;text-align:center;font-size:12px;margin-top:16px}
  @media(max-width:600px){header{align-items:start;flex-direction:column}.wrap{padding-top:28px}}
@keyframes pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Sorteo de piezas</h1>
      <div class="sub">Asignación automática de habitaciones</div>
    </div>
    <div class="tag">Sorteo aleatorio</div>
  </header>

  <section class="panel">
    <div class="machine">
      <div class="label">Asignando ahora</div>
      <div id="display">Listos para sortear</div>
      <div id="status">Presiona “Iniciar sorteo”</div>
    </div>
    <div class="bar"><div id="progress"></div></div>

    <div class="controls">
      <button class="primary" id="start">Iniciar sorteo</button>
      <button class="secondary" id="reset">Reiniciar</button>
    </div>

    <div class="results">
      <h2>Distribución</h2>
      <div class="grid" id="grid"></div>
      <div class="done" id="done">✓ Sorteo finalizado. Distribución cerrada.</div>
    </div>
  </section>

  <footer>El orden de aparición se simula dinámicamente durante el sorteo.</footer>
</div>

<script>
const roomData = [
  { id:0, title:"Pieza · 3 cabros", expected:3 },
  { id:1, title:"Pieza · 2 cabros", expected:2, special:true },
  { id:2, title:"Pieza · 2 cabros", expected:2 },
  { id:3, title:"Pieza · 2 parejas", expected:4 },
  { id:4, title:"Pieza · 1 pareja", expected:2 },
  { id:5, title:"Pieza M · 1 pareja", expected:2 },
  { id:6, title:"Pieza · 1 pareja", expected:2 }
];

const drawSequence = [
  {name:"Guzmán", room:0},
  {name:"Bertrand", room:0},
  {name:"Juan", room:0},
  {name:"Diego", room:1},
  {name:"Cleme", room:1},
  {name:"Mery", room:1, extra:true},
  {name:"Opazo", room:2},
  {name:"Lewin", room:2},
  {name:"Bru", room:3},
  {name:"Belén", room:3},
  {name:"Velasco", room:3},
  {name:"Maida", room:3},
  {name:"Tagle", room:4},
  {name:"Mery", room:4},
  {name:"Erenchun", room:5},
  {name:"Tere", room:5},
  {name:"Cabezón", room:6},
  {name:"Paula", room:6}
];

const spinnerNames = [
  "Guzmán","Bertrand","Juan","Diego","Cleme","Mery","Opazo","Lewin",
  "Bru","Belén","Velasco","Maida","Tagle","Erenchun","Tere","Cabezón","Paula"
];

const display = document.getElementById("display");
const status = document.getElementById("status");
const grid = document.getElementById("grid");
const progress = document.getElementById("progress");
const startBtn = document.getElementById("start");
const resetBtn = document.getElementById("reset");
const done = document.getElementById("done");

let running = false;
let assigned = [];
let currentIndex = 0;

function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

function renderEmpty(){
  grid.innerHTML = "";
  roomData.forEach(r => {
    const card = document.createElement("div");
    card.className = "room" + (r.special ? " special" : "");
    card.id = `room-${r.id}`;
    card.style.opacity = "1";
    card.style.transform = "none";
    card.innerHTML = `
      <div class="type">${r.title}</div>
      <div class="names" id="names-${r.id}" style="font-size:16px;color:#94a3b8">Esperando sorteo…</div>
      ${r.special ? `<div class="note" id="note-${r.id}" style="display:none">⚠ Mery salió sorteado también para esta pieza, así que finalmente quedan 3.</div>` : ""}
    `;
    grid.appendChild(card);
  });
}

function clearHighlights(){
  document.querySelectorAll(".room").forEach(x => {
    x.style.outline = "none";
    x.style.boxShadow = "none";
  });
}

function addName(item){
  clearHighlights();
  const card = document.getElementById(`room-${item.room}`);
  card.style.outline = "2px solid rgba(56,189,248,.55)";
  card.style.boxShadow = "0 0 30px rgba(56,189,248,.10)";

  assigned.push(item);
  const inRoom = assigned.filter(x => x.room === item.room);
  const box = document.getElementById(`names-${item.room}`);
  box.style.color = "#f8fafc";
  box.style.fontSize = "20px";
  box.innerHTML = inRoom.map((x, i) =>
    `<span style="
      display:inline-block;
      margin:3px 5px 3px 0;
      padding:6px 10px;
      border-radius:999px;
      background:${x.extra ? "rgba(251,191,36,.13)" : "rgba(255,255,255,.07)"};
      border:1px solid ${x.extra ? "rgba(251,191,36,.35)" : "rgba(255,255,255,.09)"};
      color:${x.extra ? "#fde68a" : "#f8fafc"};
      animation:pop .3s ease">${x.name}</span>`
  ).join("");

  if(item.extra){
    document.getElementById(`note-${item.room}`).style.display = "block";
  }

  progress.style.width = `${assigned.length / drawSequence.length * 100}%`;
}

async function spinOne(item, idx){
  const room = roomData[item.room];
  status.textContent = `Sorteando nombre ${idx + 1} de ${drawSequence.length} · ${room.title}`;

  const rounds = 13 + Math.floor(Math.random()*5);
  let last = "";
  for(let i=0; i<rounds; i++){
    let candidate;
    do{
      candidate = spinnerNames[Math.floor(Math.random()*spinnerNames.length)];
    }while(candidate === last);
    last = candidate;
    display.textContent = candidate;
    await sleep(55 + i*7);
  }

  display.textContent = item.name;
  status.textContent = `${item.name} → ${room.title}`;
  addName(item);

  if(navigator.vibrate) navigator.vibrate(35);
  await sleep(650);
}

async function run(){
  if(running) return;
  running = true;
  startBtn.disabled = true;
  resetBtn.disabled = true;
  done.classList.remove("show");

  if(currentIndex === 0){
    display.textContent = "Mezclando…";
    status.textContent = "Preparando nombres";
    await sleep(700);
  }

  for(; currentIndex < drawSequence.length; currentIndex++){
    await spinOne(drawSequence[currentIndex], currentIndex);
  }

  clearHighlights();
  display.textContent = "Sorteo terminado";
  status.textContent = "Todas las piezas fueron asignadas";
  done.classList.add("show");
  running = false;
  startBtn.disabled = false;
  resetBtn.disabled = false;
}

function reset(){
  if(running) return;
  assigned = [];
  currentIndex = 0;
  renderEmpty();
  progress.style.width = "0%";
  display.textContent = "Listos para sortear";
  status.textContent = "Presiona “Iniciar sorteo”";
  done.classList.remove("show");
}

renderEmpty();
startBtn.addEventListener("click", run);
resetBtn.addEventListener("click", reset);
</script>
</body>
</html>
